<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">Parth's Debug Loop — one boundary, one lesson</title>
<desc id="desc">An illustrative Java debugging animation: an array loop uses less-than-or-equal and hits an out-of-bounds error. Changing the condition to less-than fixes the example. This is an illustration, not a live test or project metric.</desc>
<defs>
  <linearGradient id="edge"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#172337" stroke-width=".6"/></pattern>
</defs>
<rect x="1" y="1" width="998" height="408" rx="18" fill="#0d1117" stroke="#28405a"/>
<rect x="1" y="1" width="998" height="408" rx="18" fill="url(#grid)" opacity=".5"/>
<path d="M22 1H978" stroke="url(#edge)" stroke-width="2"/>
<g font-family="Consolas, monospace">
  <circle cx="29" cy="28" r="4" fill="#fb7185"/><circle cx="45" cy="28" r="4" fill="#fbbf24"/><circle cx="61" cy="28" r="4" fill="#34d399"/>
  <text x="84" y="33" fill="#94a3b8" font-size="12">parth / debug-loop.java</text>
  <text x="966" y="33" text-anchor="end" fill="#64748b" font-size="11">AN ILLUSTRATED LEARNING LOOP</text>
  <path d="M22 49H978" stroke="#243247"/>
  <text x="32" y="91" fill="#e2e8f0" font-size="26" font-weight="bold">One boundary. One lesson.</text>
  <text x="33" y="117" fill="#94a3b8" font-size="13">Small fixes. A deeper understanding.</text>
  <rect x="28" y="140" width="545" height="194" rx="10" fill="#070d16" stroke="#233249"/>
  <text x="46" y="168" fill="#64748b" font-size="11">01 / TRACE THE LOGIC</text>
  <g font-size="15">
    <text x="46" y="207" fill="#cbd5e1"><tspan fill="#c4b5fd">int[]</tspan> values = { 2, 4, 6 };</text>
    <g>
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <rect x="40" y="222" width="515" height="27" rx="4" fill="#fb7185" opacity=".09"/>
      <text x="46" y="241" fill="#fda4af">for (int i = 0; i &lt;= values.length; i++)</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <rect x="40" y="222" width="515" height="27" rx="4" fill="#34d399" opacity=".1"/>
      <text x="46" y="241" fill="#6ee7b7">for (int i = 0; i &lt; values.length; i++)</text>
    </g>
    <text x="66" y="277" fill="#cbd5e1">System.out.println(values[i]);</text>
    <text x="46" y="312" fill="#64748b" font-size="12">// last valid index = length - 1</text>
  </g>
  <rect x="591" y="140" width="381" height="194" rx="10" fill="#070d16" stroke="#233249"/>
  <text x="610" y="168" fill="#64748b" font-size="11">02 / FEEDBACK</text>
  <g font-size="16">
    <g>
      <animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <text x="611" y="214" fill="#7dd3fc">&gt; run example</text>
      <text x="611" y="251" fill="#cbd5e1">2   4   6   ...</text>
      <text x="611" y="299" fill="#94a3b8" font-size="13">What happens at i = 3?</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <text x="611" y="214" fill="#fda4af">&gt; index out of bounds</text>
      <text x="611" y="251" fill="#cbd5e1">length: 3 / last index: 2</text>
      <text x="611" y="299" fill="#94a3b8" font-size="13">Found it: one step too far.</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <text x="611" y="214" fill="#c4b5fd">&gt; change &lt;= to &lt;</text>
      <text x="611" y="251" fill="#cbd5e1">Stop before values.length.</text>
      <text x="611" y="299" fill="#94a3b8" font-size="13">Understand the fix. Run again.</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;.25;.5;.75;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
      <text x="611" y="214" fill="#6ee7b7">&gt; example passed</text>
      <text x="611" y="251" fill="#cbd5e1">Output: 2   4   6</text>
      <text x="611" y="299" fill="#94a3b8" font-size="13">One less mystery. Keep building.</text>
    </g>
  </g>
  <text x="32" y="374" fill="#7dd3fc" font-size="13">TRY → BREAK → UNDERSTAND → IMPROVE</text>
  <text x="965" y="374" text-anchor="end" fill="#64748b" font-size="12">@parthkumar10</text>
</g>
<rect x="32" y="391" width="0" height="3" rx="1.5" fill="url(#edge)"><animate attributeName="width" from="0" to="936" dur="12s" repeatCount="indefinite"/></rect>
</svg>
